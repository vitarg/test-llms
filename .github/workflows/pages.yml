name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            test-astra/package-lock.json
            test-claude/package-lock.json
            test-fable/package-lock.json
            test-gemma4/package-lock.json
            test-gpt/package-lock.json
            test-laguna-2.1/package-lock.json
            test-MiMo-V2.6-Pro/package-lock.json
            test-ornith/package-lock.json
            test-qwen27b/package-lock.json
            test-Qwen3.6-35B-A3B/expense-tracker/package-lock.json

      - name: Validate benchmark data
        run: node scripts/validate-benchmark-data.mjs

      - name: Validate localization
        run: node scripts/validate-localization.mjs

      - name: Install app dependencies
        run: |
          set -euo pipefail
          dirs=(
            test-astra
            test-claude
            test-fable
            test-gemma4
            test-gpt
            test-laguna-2.1
            test-MiMo-V2.6-Pro
            test-ornith
            test-qwen27b
            test-Qwen3.6-35B-A3B/expense-tracker
          )
          printf '%s\n' "${dirs[@]}" | xargs -P 4 -I{} npm ci --prefix {}

      - name: Check Laguna source
        run: npm run lint && npm run typecheck
        working-directory: test-laguna-2.1

      - name: Check MiMo source
        run: npm run typecheck
        working-directory: test-MiMo-V2.6-Pro

      - name: Build Pages bundle
        run: node scripts/build-pages.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
